
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 4 - CSS Menu</title>

    <style>
        /* Định dạng trang */
        body {
            font-family: "Times New Roman", serif;
            padding: 20px;
        }

        /* Xóa dấu chấm mặc định của danh sách */
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        /* Định dạng các ô menu */
        li {
            display: inline-block;
            width: 140px;
            background-color: aqua;
            text-align: center;
            margin-right: 6px;
        }

        /* Định dạng chữ trong menu */
        li a {
            display: block;
            padding: 4px 0;
            color: blue;
            font-size: 24px;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <ul>
        <li><a href="#">TMDT</a></li>
        <li><a href="#">ERP</a></li>
        <li><a href="#">MIS</a></li>
        <li><a href="#">DS</a></li>
    </ul>

</body>
</html>
