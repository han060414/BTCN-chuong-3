
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Bài tập 5 - Font Awesome 5</title>

  <!-- Thư viện Font Awesome 5 -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      color: #333;
    }

    .best-shared {
      text-align: center;
      padding: 60px 20px;
    }

    /* Logo */
    .logo {
      margin-bottom: 25px;
    }

    .logo img {
      width: 200px;
      max-width: 100%;
      height: auto;
    }

    /* Tiêu đề */
    .best-shared h2 {
      font-size: 36px;
      font-weight: normal;
      margin-bottom: 25px;
    }

    .best-shared h2 strong {
      color: #00aeef;
      font-weight: bold;
    }

    /* Mô tả */
    .lead-text {
      font-size: 15px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    /* Danh sách nút */
    .btn-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .btn-list li {
      display: inline-block;
      margin: 0 8px 10px;
    }

    .btn-list a {
      display: inline-block;
      background-color: #30343a;
      color: white;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 3px;
      font-size: 14px;
      min-width: 140px;
    }

    /* Font Awesome - Định dạng icon */
    .btn-list i {
      margin-right: 8px;
      font-size: 16px;
      color: #ffffff;
    }

    /* Hiệu ứng khi rê chuột */
    .btn-list a:hover {
      background-color: #00aeef;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .best-shared h2 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>
  <section class="best-shared">

    <!-- Logo BIT -->
    <p class="logo">
      <img
        src="https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png"
        alt="Logo BIT UEH">
    </p>

    <!-- Tiêu đề -->
    <h2>
      Best <strong>Shared Hosting</strong> Company
    </h2>

    <!-- Mô tả -->
    <p class="lead-text">
      With this responsive landing page template,
      you can promote your all hosting,
      domain and email services.
    </p>

    <!-- Các nút có icon Font Awesome 5 -->
    <ul class="btn-list">
      <li>
        <a href="#">
          <i class="fas fa-eye" aria-hidden="true"></i>
          View Plans
        </a>
      </li>

      <li>
        <a href="#">
          <i class="fas fa-list" aria-hidden="true"></i>
          All Features
        </a>
      </li>
    </ul>

  </section>
</body>
</html>
