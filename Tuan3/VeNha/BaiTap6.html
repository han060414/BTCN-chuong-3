
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài tập 6 - My Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      background-color: white;
      color: #333;
    }

    /* Khung Portfolio */
    .portfolio {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Phần tiêu đề và menu */
    .portfolio-header {
      background-color: #f7f7f7;
      padding: 35px 15px 25px;
      text-align: center;
    }

    /* Tiêu đề */
    .portfolio h2 {
      font-size: 28px;
      font-weight: bold;
      margin: 0;
    }

    /* Đường gạch dưới tiêu đề */
    .underline {
      width: 60px;
      height: 3px;
      background-color: #58beb6;
      margin: 18px auto 30px;
    }

    /* Danh sách danh mục */
    .list-tab {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .list-tab li {
      display: inline-block;
    }

    .list-tab a {
      text-decoration: none;
      color: #333;
      font-size: 14px;
    }

    /* Danh mục All có màu xanh */
    .list-tab li:first-child a {
      color: #58beb6;
      font-weight: bold;
    }

    /* Hiệu ứng rê chuột */
    .list-tab a:hover {
      color: #58beb6;
    }

    /* Lưới hình ảnh */
    .galerry {
      list-style: none;
      padding: 0;
      margin: 12px 0 0;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .galerry li {
      overflow: hidden;
      background-color: #9bcb7c;
    }

    .galerry a {
      display: block;
    }

    .galerry img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 350 / 260;
      object-fit: cover;
    }

    /* Responsive cho máy tính bảng */
    @media (max-width: 768px) {
      .galerry {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Responsive cho điện thoại */
    @media (max-width: 480px) {
      .galerry {
        grid-template-columns: 1fr;
      }

      .portfolio h2 {
        font-size: 24px;
      }

      .list-tab {
        gap: 12px;
      }
    }
  </style>
</head>
