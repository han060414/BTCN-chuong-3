<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercise 10.9 – GET Requests | Văn Ngọc Hân</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="bar"><div class="container bar-inner"><a href="../index.html" class="brand"><span class="logo">JS</span> Hân · JavaScript Labs</a><nav><a href="../index.html">Trang chủ</a><a class="" href="../Lab08/index.html">Lab 08</a><a class="" href="../Lab09/index.html">Lab 09</a><a class="active" href="../Lab10/index.html">Lab 10</a></nav></div></header><main class="container exercise"><div class="eyebrow">LAB 10 / EXERCISE 10.9</div><h1>GET Requests</h1><p class="lede">Gọi $.get() đến tệp JSON nội bộ và tạo danh sách thành phố.</p><div class="panel demo"><button id="get" class="btn" >Lấy danh sách thành phố bằng GET</button><div class="out" id="result" aria-live="polite">Chưa có kết quả</div></div><div class="note"><b>Gợi ý kiểm tra:</b> thao tác trên nội dung bên trên; nhấn <kbd>F12</kbd> và xem tab Console/Sources nếu bài yêu cầu.</div><div class="bottom"><a href="index.html">← Danh sách Lab 10</a><a href="../index.html">Trang chủ ↗</a></div></main><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script>if(typeof window.jQuery==="undefined"){document.querySelector(".demo").insertAdjacentHTML("beforeend",'<p class="error">Chưa tải được jQuery. Cần kết nối Internet để lấy thư viện từ CDN.</p>');}else{$(function(){$("#get").on("click",function(){$("#result").text("Đang gọi GET...");$.get("data/cities.json",function(data){const list=Array.isArray(data.cities)?data.cities:[];let markup="<ul>"+$.map(list,item=>"<li>"+$("<span>").text(item.name).html()+"</li>").join("")+"</ul>";$("#result").html(markup);},"json").fail(function(){$("#result").text("Không tải được JSON. Hãy mở trang qua HTTP/GitHub Pages, không dùng file://.");});});});}</script></body></html>
