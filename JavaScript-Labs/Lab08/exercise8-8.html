<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercise 8.8 – JavaScript Functions | Văn Ngọc Hân</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="bar"><div class="container bar-inner"><a href="../index.html" class="brand"><span class="logo">JS</span> Hân · JavaScript Labs</a><nav><a href="../index.html">Trang chủ</a><a class="active" href="../Lab08/index.html">Lab 08</a><a class="" href="../Lab09/index.html">Lab 09</a><a class="" href="../Lab10/index.html">Lab 10</a></nav></div></header><main class="container exercise"><div class="eyebrow">LAB 08 / EXERCISE 8.8</div><h1>JavaScript Functions</h1><p class="lede">Viết hàm tính toán có tham số và giá trị trả về.</p><div class="panel demo"><label>Giá sản phẩm (đ) <input id="price" type="number" value="250000" min="0"></label><label>Giảm giá (%) <input id="discount" type="number" value="10" min="0" max="100"></label><button id="calc" class="btn" >Tính giá sau giảm</button><div class="out" id="result" aria-live="polite">Chưa có kết quả</div></div><div class="note"><b>Gợi ý kiểm tra:</b> thao tác trên nội dung bên trên; nhấn <kbd>F12</kbd> và xem tab Console/Sources nếu bài yêu cầu.</div><div class="bottom"><a href="index.html">← Danh sách Lab 08</a><a href="../index.html">Trang chủ ↗</a></div></main><script>function afterDiscount(price,percent){return price*(1-percent/100)}document.getElementById("calc").onclick=()=>{const price=Number(document.getElementById("price").value),discount=Number(document.getElementById("discount").value);document.getElementById("result").textContent="Giá phải trả: "+afterDiscount(price,discount).toLocaleString("vi-VN")+" đ";};</script></body></html>
