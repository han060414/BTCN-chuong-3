<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercise 8.5 – Browser Console | Văn Ngọc Hân</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="bar"><div class="container bar-inner"><a href="../index.html" class="brand"><span class="logo">JS</span> Hân · JavaScript Labs</a><nav><a href="../index.html">Trang chủ</a><a class="active" href="../Lab08/index.html">Lab 08</a><a class="" href="../Lab09/index.html">Lab 09</a><a class="" href="../Lab10/index.html">Lab 10</a></nav></div></header><main class="container exercise"><div class="eyebrow">LAB 08 / EXERCISE 8.5</div><h1>Browser Console</h1><p class="lede">Thực hành console.log(), console.warn(), console.error().</p><div class="panel demo"><button id="log" class="btn" >Ghi thông báo vào Console</button><div class="out" id="result" aria-live="polite">Chưa có kết quả</div></div><div class="note"><b>Gợi ý kiểm tra:</b> thao tác trên nội dung bên trên; nhấn <kbd>F12</kbd> và xem tab Console/Sources nếu bài yêu cầu.</div><div class="bottom"><a href="index.html">← Danh sách Lab 08</a><a href="../index.html">Trang chủ ↗</a></div></main><script>document.getElementById("log").onclick=()=>{console.log("Thông tin: Lab 08 của Văn Ngọc Hân");console.warn("Cảnh báo minh họa: dữ liệu có thể thiếu");console.error("Lỗi minh họa: không phải lỗi thực tế");document.getElementById("result").textContent="Đã ghi log, warn và error. Mở F12 → Console để kiểm tra.";};</script></body></html>
