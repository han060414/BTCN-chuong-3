<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercise 8.10 – Creating Objects | Văn Ngọc Hân</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="bar"><div class="container bar-inner"><a href="../index.html" class="brand"><span class="logo">JS</span> Hân · JavaScript Labs</a><nav><a href="../index.html">Trang chủ</a><a class="active" href="../Lab08/index.html">Lab 08</a><a class="" href="../Lab09/index.html">Lab 09</a><a class="" href="../Lab10/index.html">Lab 10</a></nav></div></header><main class="container exercise"><div class="eyebrow">LAB 08 / EXERCISE 8.10</div><h1>Creating Objects</h1><p class="lede">Dùng object literal và constructor để quản lý đơn hàng.</p><div class="panel demo"><label>Số lượng <input id="qty" type="number" value="2" min="1" max="50"></label><button id="make" class="btn" >Tạo đơn hàng</button><div class="out" id="result" aria-live="polite">Chưa có kết quả</div></div><div class="note"><b>Gợi ý kiểm tra:</b> thao tác trên nội dung bên trên; nhấn <kbd>F12</kbd> và xem tab Console/Sources nếu bài yêu cầu.</div><div class="bottom"><a href="index.html">← Danh sách Lab 08</a><a href="../index.html">Trang chủ ↗</a></div></main><script>function Order(product,price,quantity){this.product=product;this.price=price;this.quantity=quantity;this.total=function(){return this.price*this.quantity}}document.getElementById("make").onclick=()=>{const literal={code:"UEH-JS-01",customer:"Văn Ngọc Hân"},item=new Order("Sổ tay học tập",45000,Number(document.getElementById("qty").value));document.getElementById("result").innerHTML="<b>"+literal.code+"</b><br>Khách hàng: "+literal.customer+"<br>"+item.product+" × "+item.quantity+"<br>Tổng: "+item.total().toLocaleString("vi-VN")+" đ";};</script></body></html>
