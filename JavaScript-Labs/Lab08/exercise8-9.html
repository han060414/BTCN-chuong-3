<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercise 8.9 – Functions as Objects | Văn Ngọc Hân</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="bar"><div class="container bar-inner"><a href="../index.html" class="brand"><span class="logo">JS</span> Hân · JavaScript Labs</a><nav><a href="../index.html">Trang chủ</a><a class="active" href="../Lab08/index.html">Lab 08</a><a class="" href="../Lab09/index.html">Lab 09</a><a class="" href="../Lab10/index.html">Lab 10</a></nav></div></header><main class="container exercise"><div class="eyebrow">LAB 08 / EXERCISE 8.9</div><h1>Functions as Objects</h1><p class="lede">Truyền hàm làm đối số để thay đổi cách tính thuế.</p><div class="panel demo"><label>Giá trước thuế (đ) <input id="price" type="number" value="150000" min="0"></label><label>Loại thuế <select id="vat"><option value="0.08">VAT 8%</option><option value="0.1">VAT 10%</option></select></label><button id="calc" class="btn" >Tính hóa đơn</button><div class="out" id="result" aria-live="polite">Chưa có kết quả</div></div><div class="note"><b>Gợi ý kiểm tra:</b> thao tác trên nội dung bên trên; nhấn <kbd>F12</kbd> và xem tab Console/Sources nếu bài yêu cầu.</div><div class="bottom"><a href="index.html">← Danh sách Lab 08</a><a href="../index.html">Trang chủ ↗</a></div></main><script>function calculate(amount,rateFn){return amount+rateFn(amount)}const vat8=x=>x*0.08,vat10=x=>x*0.10;document.getElementById("calc").onclick=()=>{const amount=Number(document.getElementById("price").value),fn=document.getElementById("vat").value==="0.08"?vat8:vat10;document.getElementById("result").textContent="Tổng thanh toán: "+calculate(amount,fn).toLocaleString("vi-VN")+" đ";};</script></body></html>
