<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercise 8.11 – Arrays of Objects | Văn Ngọc Hân</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="bar"><div class="container bar-inner"><a href="../index.html" class="brand"><span class="logo">JS</span> Hân · JavaScript Labs</a><nav><a href="../index.html">Trang chủ</a><a class="active" href="../Lab08/index.html">Lab 08</a><a class="" href="../Lab09/index.html">Lab 09</a><a class="" href="../Lab10/index.html">Lab 10</a></nav></div></header><main class="container exercise"><div class="eyebrow">LAB 08 / EXERCISE 8.11</div><h1>Arrays of Objects</h1><p class="lede">Duyệt mảng đối tượng quốc gia và hiển thị quốc kỳ.</p><div class="panel demo"><button id="countries" class="btn" >Duyệt danh sách quốc gia</button><div class="out" id="result" aria-live="polite">Chưa có kết quả</div></div><div class="note"><b>Gợi ý kiểm tra:</b> thao tác trên nội dung bên trên; nhấn <kbd>F12</kbd> và xem tab Console/Sources nếu bài yêu cầu.</div><div class="bottom"><a href="index.html">← Danh sách Lab 08</a><a href="../index.html">Trang chủ ↗</a></div></main><script>const countries=[{name:"Việt Nam",iso:"VN",flag:"🇻🇳",capital:"Hà Nội"},{name:"Canada",iso:"CA",flag:"🇨🇦",capital:"Ottawa"},{name:"Đức",iso:"DE",flag:"🇩🇪",capital:"Berlin"},{name:"Nhật Bản",iso:"JP",flag:"🇯🇵",capital:"Tokyo"}];document.getElementById("countries").onclick=()=>{let html='<div class="card-grid">';for(const country of countries){html+='<div class="country"><span class="flag">'+country.flag+'</span><b>'+country.name+'</b><small>'+country.iso+' · '+country.capital+'</small></div>'}document.getElementById("result").innerHTML=html+'</div>';};</script></body></html>
