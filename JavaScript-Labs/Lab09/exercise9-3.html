<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercise 9.3 – Modifying the DOM | Văn Ngọc Hân</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="bar"><div class="container bar-inner"><a href="../index.html" class="brand"><span class="logo">JS</span> Hân · JavaScript Labs</a><nav><a href="../index.html">Trang chủ</a><a class="" href="../Lab08/index.html">Lab 08</a><a class="active" href="../Lab09/index.html">Lab 09</a><a class="" href="../Lab10/index.html">Lab 10</a></nav></div></header><main class="container exercise"><div class="eyebrow">LAB 09 / EXERCISE 9.3</div><h1>Modifying the DOM</h1><p class="lede">Tạo, chèn và xóa phần tử khi người dùng tương tác.</p><div class="panel demo"><button id="add" class="btn" >Thêm ghi chú</button><button id="remove" class="btn" >Xóa ghi chú cuối</button><div id="notes" class="box-group"></div><div class="out" id="result" aria-live="polite">Chưa có kết quả</div></div><div class="note"><b>Gợi ý kiểm tra:</b> thao tác trên nội dung bên trên; nhấn <kbd>F12</kbd> và xem tab Console/Sources nếu bài yêu cầu.</div><div class="bottom"><a href="index.html">← Danh sách Lab 09</a><a href="../index.html">Trang chủ ↗</a></div></main><script>let no=0;const notes=document.getElementById("notes");document.getElementById("add").onclick=()=>{const node=document.createElement("span");node.className="small-card";node.textContent="Ghi chú "+(++no);notes.appendChild(node);document.getElementById("result").textContent="Đã tạo phần tử bằng createElement + appendChild";};document.getElementById("remove").onclick=()=>{if(notes.lastElementChild){notes.removeChild(notes.lastElementChild);document.getElementById("result").textContent="Đã xóa phần tử cuối bằng removeChild";}};</script></body></html>
