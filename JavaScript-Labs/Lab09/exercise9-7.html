<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercise 9.7 – Working with Forms | Văn Ngọc Hân</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="bar"><div class="container bar-inner"><a href="../index.html" class="brand"><span class="logo">JS</span> Hân · JavaScript Labs</a><nav><a href="../index.html">Trang chủ</a><a class="" href="../Lab08/index.html">Lab 08</a><a class="active" href="../Lab09/index.html">Lab 09</a><a class="" href="../Lab10/index.html">Lab 10</a></nav></div></header><main class="container exercise"><div class="eyebrow">LAB 09 / EXERCISE 9.7</div><h1>Working with Forms</h1><p class="lede">Sử dụng focus/blur để phản hồi trong biểu mẫu.</p><div class="panel demo"><label>Họ tên <input id="fullname" placeholder="Nhập tên của bạn"></label><label>Số điện thoại <input id="phone" placeholder="Nhập số điện thoại"></label><div class="out" id="result" aria-live="polite">Chưa có kết quả</div></div><div class="note"><b>Gợi ý kiểm tra:</b> thao tác trên nội dung bên trên; nhấn <kbd>F12</kbd> và xem tab Console/Sources nếu bài yêu cầu.</div><div class="bottom"><a href="index.html">← Danh sách Lab 09</a><a href="../index.html">Trang chủ ↗</a></div></main><script>document.querySelectorAll("input").forEach(input=>{input.addEventListener("focus",()=>{input.style.background="#dbeafe";document.getElementById("result").textContent="Đang focus vào: "+input.id;});input.addEventListener("blur",()=>{input.style.background="white";document.getElementById("result").textContent="Đã blur khỏi: "+input.id;});});</script></body></html>
